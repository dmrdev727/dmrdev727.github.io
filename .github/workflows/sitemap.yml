name: Generate and Update Sitemap

on:
  push:
    branches: ["main"]  # Trigger on pushes to the main branch
  workflow_dispatch:    # Allow manual triggering
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"  # Use Node.js v18 instead of v20

      - name: Install dependencies
        run: npm install -g sitemap-cli

      - name: Generate sitemap
        run: |
          sitemap-cli generate \
            --url https://dmrdev727.github.io/ \
            --output ./sitemap.xml \
            --pretty

      - name: Commit and push sitemap
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update sitemap.xml"
          git push
